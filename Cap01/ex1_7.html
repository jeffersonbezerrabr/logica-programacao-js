<!--Calcúlo do valor do jantar-->

<meta charset="UTF-8">
<script>

    const jantar = Number(prompt("Valor do Jantar R$: "))
    const taxa = jantar * (10 / 100) // jantar * 0.10
    const total = jantar + taxa

    alert(`Taxa Garçom R$: ${taxa.toFixed(2)}\nTotal R$: ${total.toFixed(2)}`)

</script>
